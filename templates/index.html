<!DOCTYPE html>
<html>
<head>
    <title>StudyPilot</title>
</head>

<body>

    <h1>StudyPilot 📚</h1>
    <p>Your AI-powered study planner</p>

    <form action="/create-plan" method="POST">

    <label>Syllabus / Topics:</label>
    <br>
    <textarea name="syllabus" rows="8" cols="50"
        placeholder="Enter your syllabus or topics here..." required></textarea>

    <br><br>

    <label>Exam Date:</label>
    <br>
    <input type="date" name="exam_date" required>

    <br><br>

    <label>Daily Study Hours:</label>
    <br>
    <input type="number" name="study_hours" min="1" max="24"
        placeholder="e.g. 4" required>

    <br><br>

    <button type="submit">Create Study Plan</button>

</form>

</body>
</html>
